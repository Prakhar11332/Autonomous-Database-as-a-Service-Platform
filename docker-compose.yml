version: "3.9"

# Local dev infra for the control plane.
# This is NOT where tenant databases live — tenant DBs are spun up
# dynamically by the Provisioning Engine via the Docker API.

services:
  control-plane-db:
    image: postgres:16
    container_name: dbaas-control-plane-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbaas_admin
      POSTGRES_PASSWORD: change_me_in_env
      POSTGRES_DB: dbaas_control_plane
    ports:
      - "5432:5432"
    volumes:
      - control_plane_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbaas_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dbaas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: dbaas-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: dbaas-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: change_me_in_env

volumes:
  control_plane_data:
